<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ParseLock - Fill. Generate. Done.</title>
  <meta name="description" content="Generate documents from templates and spreadsheets." />
  <link rel="icon" type="image/png" href="/parselock-icon-192.png" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/editor.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>
  <a href="#app" class="skip-link">Skip to content</a>
  <div id="privacy-banner" class="privacy-banner" hidden>
    <div>
      <strong>Privacy notice</strong>
      <span>ParseLock keeps data local and follows RA 10173. By continuing you accept our minimal use of local storage and auth cookies.</span>
    </div>
    <div style="display:flex;gap:0.5rem;">
      <button id="privacy-accept" class="btn btn-small">Accept</button>
      <a href="#privacy" class="btn btn-secondary btn-small">Learn more</a>
    </div>
  </div>
  <header class="site-header">
    <div class="container header-inner">
      <a href="#templates" class="brand" aria-label="ParseLock home">
        <img src="/parselock-icon-192.png" alt="" class="brand-icon" width="32" height="32" />
        <span class="wordmark">Parse<span class="accent">Lock</span></span>
      </a>
      <nav class="main-nav" aria-label="Primary">
        <a href="#templates">My Templates</a>
        <a href="#privacy">Privacy</a>
      </nav>
      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">Dark</button>
      <div id="auth-area" class="auth-area"></div>
    </div>
  </header>
  <div data-ad-slot="top-banner" class="ad-slot ad-top"></div>
  <main id="app" class="container"></main>
  <div data-ad-slot="bottom-banner" class="ad-slot ad-bottom"></div>
  <footer class="site-footer"><div class="container"><p>ParseLock v1.0.0-phase1</p></div></footer>

  <div id="confirm-modal" class="modal" hidden><div class="modal-backdrop"></div><div class="modal-dialog"><p id="confirm-message"></p><div class="modal-actions"><button id="confirm-ok">OK</button><button id="confirm-cancel">Cancel</button></div></div></div>
  <div id="auth-modal" class="modal" hidden><div class="modal-backdrop"></div><div class="modal-dialog"><h3 style="margin:0 0 1rem;font-size:1rem;" id="auth-modal-title">Sign in</h3><form id="auth-form" class="page-setup-form"><div class="page-setup-row"><label>Email</label><input id="auth-email" type="email" class="input" required /></div><div class="page-setup-row"><label>Password</label><input id="auth-password" type="password" class="input" required /></div><p id="auth-error" class="error" style="margin:0;font-size:0.8125rem;"></p><div class="modal-actions"><button id="auth-cancel" class="btn btn-secondary" type="button">Cancel</button><button id="auth-submit" class="btn" type="submit">Sign in</button></div></form><button id="auth-google" class="btn btn-secondary" type="button" style="width:100%;margin-top:0.75rem;">Continue with Google</button></div></div>
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <script type="module" src="/js/config.js"></script>
  <script type="module" src="/js/ads.js"></script>
  <script type="module" src="/js/supabase.js"></script>
  <script type="module" src="/js/auth.js"></script>
  <script type="module" src="/js/tasks.js"></script>
  <script type="module" src="/js/ui.js"></script>
  <script type="module" src="/js/sheet.js"></script>
  <script type="module" src="/js/generate.js"></script>
  <script type="module" src="/js/export.js"></script>
  <script type="module" src="/js/editor/placeholders.js"></script>
  <script type="module" src="/js/editor/pageSetup.js"></script>
  <script type="module" src="/js/editor/drawer.js"></script>
  <script type="module" src="/js/editor/toolbar.js"></script>
  <script type="module" src="/js/editor/formatting.js"></script>
  <script type="module" src="/js/app.js"></script>
  <script type="module">import { init } from '/js/app.js'; init();</script>
</body>
</html>
